[package]
name = "tg-rcore-tutorial-ch1-t2l3"
description = "Chapter 1 T2L3: minimal no_std RISC-V S-mode demo with legacy VirtIO block read/write verification"
version = "0.0.1-preview.1"
edition = "2024"
authors = ["Feiran Qin <qfr23@mails.tsinghua.edu.cn>"]
repository = "https://github.com/os-biglab/tg-rcore-tutorial-ch1-T2L3"
homepage = "https://github.com/os-biglab/tg-rcore-tutorial-ch1-T2L3/tree/test"
documentation = "https://github.com/os-biglab/tg-rcore-tutorial-ch1-T2L3/tree/test/docs"
license = "GPL-3.0"
readme = "README.md"
keywords = ["rcore", "tutorial", "no-std", "riscv", "bare-metal"]
categories = ["no-std", "embedded"]
publish = true

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"

[dependencies]
tg-sbi = { package = "tg-rcore-tutorial-sbi", version = "0.4.8", features = ["nobios"] }
